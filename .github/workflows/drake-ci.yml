name: Drake CI

on:
  pull_request:
    branches: ["1.21-latin"]
  push:
    branches: ["1.21-latin"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven (standalone-safe)
        if: ${{ hashFiles('pom.xml') != '' }}
        shell: bash
        run: |
          if grep -q '<artifactId>drakes-slimefun-labs</artifactId>' pom.xml; then
            echo '::notice title=CI fallback::Parent drakes-slimefun-labs detectado; se omite build Maven completo en repos standalone.'
            exit 0
          fi
          mvn -B -ntp -DskipTests clean package

      - name: Build with Gradle (standalone-safe)
        if: ${{ hashFiles('gradlew') != '' && hashFiles('pom.xml') == '' }}
        shell: bash
        run: |
          echo '::notice title=CI fallback::Repo Gradle standalone detectado; se valida workflow sin build pesado en PR.'
          exit 0