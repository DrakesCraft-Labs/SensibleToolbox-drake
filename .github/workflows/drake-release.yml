name: Drake Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven (standalone-safe)
        if: ${{ hashFiles('pom.xml') != '' }}
        shell: bash
        run: |
          if grep -q '<artifactId>drakes-slimefun-labs</artifactId>' pom.xml; then
            echo '::notice title=Release fallback::Parent drakes-slimefun-labs detectado; se omite build Maven completo en repos standalone.'
            exit 0
          fi
          mvn -B -ntp -DskipTests clean package

      - name: Build with Gradle (standalone-safe)
        if: ${{ hashFiles('gradlew') != '' && hashFiles('pom.xml') == '' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew shadowJar || ./gradlew build -x test

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            **/target/*.jar
            **/build/libs/*.jar